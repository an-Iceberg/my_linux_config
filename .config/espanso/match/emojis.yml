matches:
  - triggers:
    - ";bolt"
    - ";zig"
    - ";zap"
    replace: "⚡"
  - trigger: ";warn"
    replace: "⚠️"
  - triggers:
    - ";xd"
    - ";xD"
    - ";Xd"
    - ";XD"
    replace: "😆"
  - triggers:
    - ";xp"
    - ";xP"
    - ";Xp"
    - ";XP"
    replace: "😝"
  - trigger: ";+1"
    replace: "👍"
  - trigger: ";-1"
    replace: "👎"
  - trigger: ";star"
    replace: "🌟"
  - trigger: ";spark"
    replace: "✨"
  - trigger: "=D"
    replace: "😃"
