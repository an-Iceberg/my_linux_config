matches:
  - trigger: ";-"
    replace: "—"
  - trigger: ";dash"
    replace: "–"
  - trigger: "!!"
    replace: "‼"
  - trigger: "??"
    replace: "⁇"
  - trigger: "?!"
    replace: "⁈"
  - trigger: "!?"
    replace: "⁉"
  - trigger: ";euro"
    replace: "€"
  - trigger: ";deg"
    replace: "°"

  - triggers:
    - ";dots"
    - "..."
    replace: "…"
  - trigger: ";<<"
    replace: "«"
  - trigger: ";>>"
    replace: "»"
  - trigger: ";> "
    replace: "› "
  - trigger: ";< "
    replace: "‹"
  - trigger: ";>,"
    replace: "›,"
  - trigger: ";>."
    replace: "›."
  - trigger: ";,,"
    replace: "„"
  - trigger: ";''"
    replace: "“"
  - trigger: ";\""
    replace: "”"

  # Todo:try these out
  # - trigger: ';"'
  #   replace: "“$|$”"
  # - trigger: ";'"
  #   replace: "‘$|$’"

  - triggers:
    - ";bull"
    - ";bullet"
    replace: "•"
  - triggers:
    - ";tri"
    - ";triangle"
    replace: "‣"

  - trigger: ";copy"
    replace: "©"
  - trigger: ";reg"
    replace: "®"
  - trigger: ";trade"
    replace: "™"
