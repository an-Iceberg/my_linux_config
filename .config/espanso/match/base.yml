# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.
matches:
  # Simple text replacement

  - trigger: "blahaj"
    replace: "blåhaj"
  - trigger: "Blahaj"
    replace: "Blåhaj"
  - trigger: "BLAHAJ"
    replace: "BLÅHAJ"
  - triggers:
    - ";valve"
    - "Valve"
    replace: "VALVᴱ"
  - trigger: ";worry"
    replace: "ó.ò"
  - trigger: ";angy"
    replace: "ò.ó"
  - triggers:
    - "H2O"
    - "h2O"
    - "H2o"
    - "h2o"
    replace: "H₂O"

  # NOTE: espanso uses YAML to define matches, so pay attention to the indentation!

  # But matches can also be dynamic:

  # Print the current date
  - trigger: ";today"
    replace: "{{mydate}}"
    vars:
    - name: mydate
      type: date
      params:
        format: "%d.%m.%Y"

  # Print the current time
  - trigger: ";now"
    replace: "{{mytime}}"
    vars:
    - name: mytime
      type: date
      params:
        format: "%H:%M"

  # Print the output of a shell command
  - trigger: ";shell"
    replace: "{{output}}"
    vars:
    - name: output
      type: shell
      params:
        cmd: "echo 'Hello from your shell'"

  # And much more! For more information, visit the docs: https://espanso.org/docs/

  - trigger: ";shrug"
    replace: "¯\\_(ツ)_/¯"
  - trigger: ";shock"
    replace: "ಠ_ಠ"
  - triggers:
    - ";tableflip"
    - ";fliptable"
    replace: "(╯°□°）╯︵ ┻━┻"
  - trigger: ";fixtable"
    replace: "┬─┬ノ( º _ ºノ)"


  - trigger: ";check"
    replace: "✓"
  - triggers:
    - ";yes"
    - ";bcheck"
    - ";boldcheck"
    - ";echeck"
    - ";emojicheck"
    replace: "✔"
  - trigger: ";x "
    replace: "×"
  - triggers:
    - ";no "
    - ";bx"
    - ";boldx"
    - ";ex "
    - ";emojix"
    replace: "❌"
  - triggers:
    - ";fallingstar"
    - ";starfalling"
    - ";meteor"
    - ";comet"
    replace: "🌠"
  - trigger: ";hex"
    replace: "⬡"
  - triggers:
    - ";bhex"
    - ";fhex"
    - ";hexf"
    - ";boldhex"
    - ";fillhex"
    - ";hexbold"
    - ";hexfill"
    replace: "⬢"

