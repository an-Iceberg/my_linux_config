matches:
  - trigger: ";xor"
    replace: "⊕"
  - trigger: ";sim "
    replace: "≈"
  - trigger: ";simeq"
    replace: "≃"
  - trigger: ";cong"
    replace: "≅"
  - trigger: ";partial"
    replace: "∂"
  - trigger: ";mdot"
    replace: "·"
  - trigger: ";nabla"
    replace: "∇"
  - trigger: ";int"
    replace: "∫"
  - trigger: ";sum"
    replace: "∑"
  - trigger: ";prod"
    replace: "∏"
  - trigger: ";ring"
    replace: "∘"
  - trigger: ";times"
    replace: "×"
  - trigger: ";div"
    replace: "÷"
  - trigger: ";cdot"
    replace: "‧"
  - triggers:
    - ";pm"
    - ";+-"
    replace: "±"
  - trigger: ";land"
    replace: "∧"
  - trigger: ";lor"
    replace: "∨"
  - trigger: ";lnot"
    replace: "¬"
  - trigger: ";cap"
    replace: "∩"
  - trigger: ";cup"
    replace: "∪"
  - trigger: ";exists"
    replace: "∃"
  - trigger: ";nexists"
    replace: "∄"
  - trigger: ";forall"
    replace: "∀"
  - trigger: ";in "
    replace: "∈"
  - trigger: ";nin"
    replace: "∉"
  - trigger: ";infty"
    replace: "∞"
  - trigger: ";approx"
    replace: "≈"
  - trigger: ";if "
    replace: "→"
  - trigger: ";to "
    replace: "→ "
  - trigger: ";nif "
    replace: "↛"
  - trigger: ";iff"
    replace: "↔"
  - trigger: ";niff"
    replace: "↮"
  - trigger: ";def"
    replace: "≝"
  - triggers:
    - ";leq"
    - ";<="
    replace: "≤"
  - triggers:
    - ";geq"
    - ";>="
    replace: "≥"
  - triggers:
    - ";neq"
    - ";!="
    replace: "≠"
  - triggers:
    - ";eq?"
    - ";?="
    - ";=?"
    - ";eqals?"
    replace: "≟"
  - trigger: ";eqiv"
    replace: "≡"
  - trigger: ";mod"
    replace: "≡"
  - trigger: ";subset "
    replace: "⊂"
  - trigger: ";subseteq"
    replace: "⊆"
  - trigger: ";nsubset "
    replace: "⊄"
  - trigger: ";nsubseteq"
    replace: "⊈"
  - triggers:
    - ";varnothing"
    - ";empty"
    - ";{}"
    - ";avg"
    - ";average"
    - ";mean"
    replace: "⌀"

  # Maps
  - trigger: ";mapsto"
    replace: "↦"
  - trigger: ";longmapsto"
    replace: "⟼"
  - trigger: ";Mapsto"
    replace: "⤇"
  - trigger: ";longMapsto"
    replace: "⟾"
